# Perfil de pruebas JUnit (sin secretos en el código)
# Permite parametrizar la base de pruebas mediante variables de entorno con valores por defecto.
spring.application.name=isw-practicas-test

spring.datasource.url=${ISW_TEST_DB_URL:jdbc:mysql://${ISW_DB_HOST:127.0.0.1}:${ISW_DB_PORT:3306}/isw_practicas?serverTimezone=America/Santiago&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
spring.datasource.username=${ISW_TEST_DB_USER:isw_app}
spring.datasource.password=${ISW_TEST_DB_PASSWORD:${ISW_DB_PASSWORD:}}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Clave JWT de prueba (32+ caracteres)
app.jwt.secret=${ISW_JWT_SECRET:clave-secreta-de-prueba-junit-de-al-menos-32-caracteres}
app.jwt.expiracion-horas=1

app.planificacion.dias-anticipacion-minimos=3
app.adjuntos.directorio=target/test-adjuntos
