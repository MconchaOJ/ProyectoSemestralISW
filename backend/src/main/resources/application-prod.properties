# =============================================================================
# Perfil de PRODUCCIÓN (servidor de la UBB, Sprint 2). Ver DESPLIEGUE.md, sección 4.
# Se activa con:  java -jar practicas.jar --spring.profiles.active=prod
# Solo sobrescribe lo distinto de application.properties; el resto (base de datos como isw_app con
# ISW_DB_PASSWORD, ddl-auto=validate, JWT de 8 horas, reglas de planificación) se hereda igual.
# Aquí no va ninguna clave: todas vienen de variables de entorno del servicio.
# =============================================================================

# --- JWT: ISW_JWT_SECRET es obligatoria (mínimo 32 caracteres) ---
# Sin ella la aplicación NO arranca. En desarrollo se genera un secreto temporal, pero en el servidor eso
# cerraría la sesión de todos los usuarios en cada reinicio.
app.jwt.secreto-obligatorio=true

# --- Swagger desactivado: en internet no se publica el mapa completo de la API ---
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# --- Detrás de Nginx (proxy inverso con HTTPS) ---
# Usa X-Forwarded-Proto/Host/For para saber que la petición original llegó por HTTPS y desde qué IP.
server.forward-headers-strategy=framework

# --- Documentos y audios: ruta absoluta, fuera de la carpeta de la aplicación (no se pierden al actualizar) ---
app.adjuntos.directorio=${APP_ADJUNTOS_DIRECTORIO:/var/lib/isw-practicas/adjuntos}

# --- Registros (logs) a archivo en vez de consola ---
# Logback rota el archivo (10 MB por archivo, 30 días). A la consola (journal de systemd) solo llegan los ERROR,
# para que un fallo al arrancar (por ejemplo, falta ISW_JWT_SECRET) se vea también con journalctl.
logging.file.name=${ISW_LOG_FILE:/var/log/isw-practicas/isw-practicas.log}
logging.threshold.console=ERROR
spring.main.banner-mode=log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
