spring.application.name=isw-practicas
server.port=8080
spring.profiles.default=dev

spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# --- Base de datos: la app se conecta como isw_app (nunca como root) ---
# La clave viene de variable de entorno (sin valor por defecto: si falta, la aplicación no arranca).
spring.datasource.url=${DB_URL:${ISW_DB_URL:jdbc:mysql://${ISW_DB_HOST:127.0.0.1}:${ISW_DB_PORT:3306}/isw_practicas?serverTimezone=America/Santiago&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}}
spring.datasource.username=${DB_USER:${ISW_DB_USER:isw_app}}
spring.datasource.password=${DB_PASSWORD:${ISW_DB_PASSWORD}}

# --- JPA: Hibernate solo lo VALIDA, Flyway versiona el esquema ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=32

# --- Flyway: migraciones automáticas de esquema ---
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

# --- JWT (S-06: 8 horas) ---
# Secreto opcional (mínimo 32 caracteres) en la variable de entorno ISW_JWT_SECRET.
# Si no existe, se genera uno aleatorio al arrancar (los tokens dejan de valer al reiniciar).
app.jwt.secret=${ISW_JWT_SECRET:}
app.jwt.expiracion-horas=8

# --- Reglas de planificación (S-35) ---
# Días mínimos entre enviar la planificación a revisión y la clase (un estudiante reportó "unos 3 días antes").
# Con 0 se puede enviar hasta el mismo día de la clase.
app.planificacion.dias-anticipacion-minimos=3

# --- Documentos adjuntos y nota de voz (Fase E) ---
# Carpeta en disco (relativa al directorio desde donde se arranca el jar, normalmente backend/), fuera de git.
app.adjuntos.directorio=adjuntos
# Límite de Spring para cada archivo y para la petición completa (algo mayor que el máximo de 10 MB de los
# documentos y de 25 MB del audio, para dejar margen a los demás campos del multipart).
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=30MB

# --- Swagger UI ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method

spring.mvc.problemdetails.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
spring.jackson.deserialization.accept-float-as-int=false
