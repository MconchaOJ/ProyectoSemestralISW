spring.application.name=isw-practicas
server.port=8080

# --- Base de datos: la app se conecta como isw_app (nunca como root) ---
# La clave viene SOLO de la variable de entorno ISW_DB_PASSWORD (sin valor por defecto a propósito:
# si falta, la aplicación no arranca).
spring.datasource.url=jdbc:mysql://${ISW_DB_HOST:127.0.0.1}:${ISW_DB_PORT:3306}/isw_practicas?serverTimezone=America/Santiago&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=${ISW_DB_USER:isw_app}
spring.datasource.password=${ISW_DB_PASSWORD}

# --- JPA: el esquema lo crea db/schema.sql; Hibernate solo lo VALIDA, nunca lo modifica ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_batch_fetch_size=32

# --- JWT (S-06: 8 horas) ---
# Secreto opcional (mínimo 32 caracteres) en la variable de entorno ISW_JWT_SECRET.
# Si no existe, se genera uno aleatorio al arrancar (los tokens dejan de valer al reiniciar).
app.jwt.secret=${ISW_JWT_SECRET:}
app.jwt.expiracion-horas=8

# --- Límite de intentos de inicio de sesión (Sprint 2; SUPUESTO S-49: valores no pedidos por el cliente) ---
# Fallos seguidos permitidos con un mismo correo y minutos que ese correo queda bloqueado después.
# Un login correcto reinicia la cuenta. El registro vive en memoria: se pierde al reiniciar la aplicación.
app.login.intentos-maximos=5
app.login.bloqueo-minutos=15

# --- Recuperación de la clave por correo (SUPUESTOS S-97 a S-99) ---
# Minutos que vale el enlace (15 a 60) y cuántos enlaces puede pedir un mismo correo en la ventana de minutos.
# Pasado el límite se responde igual (200 con el mensaje genérico), pero no se crea ni se manda otro enlace.
app.recuperacion.minutos-validez=30
app.recuperacion.solicitudes-maximas=3
app.recuperacion.ventana-minutos=15
# Dirección pública del sistema para armar el enlace del correo (nunca se toma de la cabecera Host de la petición).
app.recuperacion.url-publica=${ISW_URL_PUBLICA:http://localhost:8080}

# --- Correo saliente (SMTP). Lo mismo que necesitará HU-19 ---
# SOLO desde variables de entorno y sin valores reales por defecto. Sin ISW_SMTP_HOST la aplicación arranca igual
# y el enlace de recuperación se escribe en el log del servidor (WARN) en vez de mandarse.
# Puerto 587 = STARTTLS; 465 = SSL directo. ISW_SMTP_REMITENTE vacío = se usa ISW_SMTP_USUARIO.
app.correo.host=${ISW_SMTP_HOST:}
app.correo.puerto=${ISW_SMTP_PUERTO:587}
app.correo.usuario=${ISW_SMTP_USUARIO:}
app.correo.clave=${ISW_SMTP_CLAVE:}
app.correo.remitente=${ISW_SMTP_REMITENTE:}

# --- Reglas de planificación (S-35) ---
# Días mínimos entre enviar la planificación a revisión y la clase (un estudiante reportó "unos 3 días antes").
# Con 0 se puede enviar hasta el mismo día de la clase.
app.planificacion.dias-anticipacion-minimos=3
# HU-14 (SUPUESTO S-79): una planificacion "requiere atencion" en el panel si espera revision mas de estos dias
app.panel.dias-atencion=3

# --- Documentos adjuntos y nota de voz (Fase E) ---
# Carpeta en disco (relativa al directorio desde donde se arranca el jar, normalmente backend/), fuera de git.
app.adjuntos.directorio=adjuntos
# Límite de Spring para cada archivo y para la petición completa (algo mayor que el máximo de 10 MB de los
# documentos y de 25 MB del audio, para dejar margen a los demás campos del multipart).
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=30MB

# --- Chatbot de retroalimentación (HU-15; SUPUESTO S-59: proveedor Groq, sin confirmar con el cliente) ---
# La clave viene SOLO de la variable de entorno ISW_GROQ_API_KEY. Sin ella la aplicación arranca igual y el
# chatbot responde 503 ("no está configurado"); el resto del sistema no se ve afectado.
app.chatbot.api-key=${ISW_GROQ_API_KEY:}
app.chatbot.url-base=https://api.groq.com/openai/v1
# Modelo gratuito de Groq (por qué este, en backend/PROGRESO.md, sección del chatbot)
app.chatbot.modelo=openai/gpt-oss-120b
# Incluye los tokens de razonamiento de gpt-oss; la capa gratuita los descuenta del límite por minuto
app.chatbot.max-tokens=3000
app.chatbot.temperatura=0.3
app.chatbot.timeout-segundos=60
app.chatbot.reintentos=2

# --- Swagger UI ---
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=method

spring.mvc.problemdetails.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
spring.jackson.deserialization.accept-float-as-int=false
