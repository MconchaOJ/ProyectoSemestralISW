# =============================================================================
# Nginx: proxy inverso con HTTPS delante de la aplicación (Sprint 2, DESPLIEGUE.md).
# deploy/install.sh lo copia a /etc/nginx/sites-available/isw-practicas
# reemplazando __DOMINIO__ por el subdominio real (por ejemplo practicas-pem.ubiobio.cl).
#
# - Puerto 80: solo redirige a HTTPS (y deja pasar la validación de Let's Encrypt).
# - Puerto 443: HTTPS. El micrófono de la nota de voz SOLO funciona en páginas HTTPS.
# - La aplicación escucha en 127.0.0.1:8080: desde afuera no se puede llegar a ella sin pasar por aquí.
# - client_max_body_size 30M: igual al límite de la aplicación (spring.servlet.multipart.max-*-size=30MB).
#
# Certificado: /etc/ssl/isw-practicas/fullchain.pem y privkey.pem. install.sh deja uno AUTOFIRMADO
# provisorio para que nginx arranque; hay que reemplazarlo por el de la universidad o el de
# Let's Encrypt (ver GUIA_DESPLIEGUE_EQUIPO.md, paso 7).
# Después de editar:  sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name __DOMINIO__;

    # Validación de Let's Encrypt (certbot certonly --webroot -w /var/www/letsencrypt)
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # "http2" en la línea listen funciona desde nginx 1.9 hasta hoy (en 1.25.1+ solo avisa que es antiguo)
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMINIO__;

    ssl_certificate     /etc/ssl/isw-practicas/fullchain.pem;
    ssl_certificate_key /etc/ssl/isw-practicas/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Documentos (10 MB) y audios de nota de voz: hasta 30 MB por petición
    client_max_body_size 30M;

    # Strict-Transport-Security, X-Content-Type-Options y X-Frame-Options ya los envía la aplicación
    # (Spring Security, al saber por X-Forwarded-Proto que la petición llegó por HTTPS): repetirlos aquí los duplica.
    add_header Referrer-Policy "same-origin" always;

    access_log /var/log/nginx/isw-practicas.access.log;
    error_log  /var/log/nginx/isw-practicas.error.log;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        # Generar la cartola en PDF o subir un audio grande puede tardar más que lo normal
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
