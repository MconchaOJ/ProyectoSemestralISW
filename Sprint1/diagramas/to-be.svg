<text text-anchor="start" font-size="11" fill="#22242a" font-weight="normal"><tspan x="1408" y="550.9">Verde: se construye en el Sprint 1 (HU-01 a HU-05).</tspan><tspan x="1408" y="563.9">Gris: llega en sprints siguientes. Blanco: pasa</tspan><tspan x="1408" y="576.9">fuera del sistema.</tspan></text>
