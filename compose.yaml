# compose.yaml - Entorno reproducible de base de datos MySQL con Docker
services:
  mysql:
    image: mysql:8.4
    container_name: isw-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: isw_practicas
      MYSQL_USER: isw_app
      MYSQL_PASSWORD: ${DB_PASSWORD:-isw_secret_2026}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret_2026}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

volumes:
  mysql_data:
