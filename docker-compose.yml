# =============================================================================
# docker-compose.yml - ISW Prácticas (desarrollo local)
#
# Levanta MySQL 8.4 LTS + Backend Spring Boot en una red aislada.
# Las credenciales se leen de .env.docker (ver .env.docker.example). No hay claves
# por defecto: si falta --env-file .env.docker o alguna clave, el compose se
# detiene con un error en vez de usar una clave escrita en git.
#
# Uso rápido:
#   cp .env.docker.example .env.docker
#   # editar .env.docker y completar las claves (obligatorias)
#   docker compose --env-file .env.docker up -d       (o podman-compose --env-file .env.docker up -d)
#   docker compose --env-file .env.docker logs -f backend
# =============================================================================

services:
  # ── Base de datos ───────────────────────────────────────────────────────────
  database:
    image: docker.io/library/mysql:8.4
    container_name: isw-mysql
    restart: unless-stopped
    env_file: .env.docker
    environment:
      MYSQL_DATABASE: isw_practicas
      MYSQL_USER: ${ISW_DB_USER:-isw_app}
      MYSQL_PASSWORD: ${ISW_DB_PASSWORD:?Falta ISW_DB_PASSWORD - usa --env-file .env.docker}
      MYSQL_ROOT_PASSWORD: ${ISW_DB_ROOT_PASSWORD:?Falta ISW_DB_ROOT_PASSWORD - usa --env-file .env.docker}
      # Collation del proyecto (utf8mb4_0900_ai_ci)
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_0900_ai_ci
    # SEGURIDAD: La base de datos no expone puertos al exterior (solo vive dentro de la red 'isw-net')
    # ports:
    #   - "${ISW_DB_PORT_HOST:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Scripts de inicialización: MySQL los ejecuta en orden alfabético solo la primera vez
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    # Sano = el servidor definitivo acepta conexiones TCP y el usuario de la app entra a la base.
    # Mientras se cargan schema.sql y seed.sql, MySQL usa un servidor temporal sin red, así que esto
    # falla hasta que la carga termina. $$ = la variable se lee dentro del contenedor (sin escribir
    # la clave en la configuración del compose).
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=TCP -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" -e 'SELECT 1' isw_practicas > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 24          # hasta ~5 minutos en total para la primera carga
    networks:
      - isw-net

  # ── Backend Spring Boot (API REST para Postman) ─────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: isw-backend
    restart: unless-stopped
    env_file: .env.docker
    depends_on:
      database:
        condition: service_healthy
    environment:
      # Conexión a la BD: el host es el nombre del servicio Docker ("database")
      ISW_DB_HOST: database
      ISW_DB_PORT: 3306
      ISW_DB_USER: ${ISW_DB_USER:-isw_app}
      ISW_DB_PASSWORD: ${ISW_DB_PASSWORD:?Falta ISW_DB_PASSWORD - usa --env-file .env.docker}
      ISW_JWT_SECRET: ${ISW_JWT_SECRET:-}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
    ports:
      - "${ISW_BACKEND_PORT:-8018}:8080"
    volumes:
      # Adjuntos persistentes fuera del contenedor
      - adjuntos_data:/app/adjuntos
    healthcheck:
      test: ["CMD-SHELL", "curl -f -s http://localhost:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 35s
      retries: 3
    networks:
      - isw-net

  # ── Frontend Web (Nginx Proxy en puerto 8017) ────────────────────────────────
  frontend:
    image: docker.io/library/nginx:alpine
    container_name: isw-frontend
    restart: unless-stopped
    ports:
      - "${ISW_FRONTEND_PORT:-8017}:80"
    volumes:
      - ./backend/src/main/resources/static:/usr/share/nginx/html:ro
      - ./nginx-frontend.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - isw-net

# ── Red interna ───────────────────────────────────────────────────────────────
networks:
  isw-net:
    driver: bridge

# ── Volúmenes persistentes ────────────────────────────────────────────────────
volumes:
  mysql_data:
    name: isw-mysql-data
  adjuntos_data:
    name: isw-adjuntos-data
